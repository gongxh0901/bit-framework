name: Release packages

# Changesets 在 main 上创建/更新 Release PR；合并 Release PR 后发布变更包。
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm changeset status
      - run: pnpm build

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write # Changesets 发布后需要创建包级 git tag
      pull-requests: write # Changesets 需要创建/更新 Release PR
      id-token: write # trusted publishing 需要，用于向 npm 换取 OIDC 凭证

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # fgui 是构建 bit-ui / bit-condition 的前置依赖

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # trusted publishing 要求 npm >= 11.5.1、Node >= 22.14.0
      # 不设 registry-url：它会写一份带 ${NODE_AUTH_TOKEN} 的 .npmrc，
      # 而 trusted publishing 不用 token，空值会让后续 npm 命令鉴权失败。
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Verify npm version
        run: npm -v

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Create Release PR or publish packages
        uses: changesets/action@v1
        with:
          version: pnpm version:packages
          publish: pnpm publish:npm
          commit: 'chore: release packages'
          title: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
