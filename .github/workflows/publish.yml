name: Release packages
run-name: Unified release · ${{ inputs.request_id || github.run_id }}

# 日常 PR 只校验，统一发版由本地 publish 或手动调度明确触发。
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      request_id:
        description: 本地发布请求标识
        type: string
        required: false
      requested_sha:
        description: 本次请求对应的 main 提交
        type: string
        required: false

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jdx/mise-action@v4
      - run: mise run setup
      - run: mise exec -- node scripts/version-packages.mjs --status
      - run: mise exec -- node --test scripts/*.test.mjs
      - run: mise run build
      - run: mise exec -- node scripts/publish-npm.mjs --dry-run

  release:
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/bit-framework-release/pending')
    runs-on: ubuntu-latest
    concurrency:
      group: bit-framework-release
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # npm publish 和 dist-tag 使用 OIDC。
    steps:
      - name: Create cross-repository token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            bit-framework
            FGUI-cocoscreator
          permission-contents: write

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: jdx/mise-action@v4

      - name: Verify requested source
        env:
          REQUESTED_SHA: ${{ inputs.requested_sha }}
        run: |
          if [ -n "$REQUESTED_SHA" ] && [ "$REQUESTED_SHA" != "$(git rev-parse HEAD)" ]; then
            echo '工作流事件提交与请求来源不一致，请核对发布引用后重试'
            exit 1
          fi

      # 恢复先于依赖安装和构建，补发始终使用原批次源码。
      - name: Select release source
        id: source
        run: mise exec -- node scripts/release-git.mjs select

      - name: Configure Git identity
        if: steps.source.outputs.mode != 'none'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Upgrade npm
        if: steps.source.outputs.mode != 'none'
        run: npm install -g npm@11.21.2
      - if: steps.source.outputs.mode != 'none'
        run: mise run setup
      - if: steps.source.outputs.mode != 'none'
        run: mise exec -- node scripts/version-packages.mjs --status
      - if: steps.source.outputs.mode != 'none'
        run: mise exec -- node --test scripts/*.test.mjs
      - if: steps.source.outputs.mode != 'none'
        run: mise run build

      # 构建成功后统一生成版本、CHANGELOG、锁文件和父子仓库版本提交。
      - name: Generate and commit the unified version
        if: steps.source.outputs.mode == 'version'
        run: mise exec -- node scripts/version-packages.mjs

      # OIDC 身份绑定工作流事件提交；版本提交必须在新的运行中上传。
      - name: Publish or prepare the frozen batch
        id: publish
        if: steps.source.outputs.mode != 'none'
        run: |
          if [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]; then
            mise exec -- node scripts/publish-npm.mjs
            echo 'status=published' >> "$GITHUB_OUTPUT"
          else
            mise exec -- node --input-type=module -e "const { RELEASE_PROTOCOL } = await import('./scripts/publish-npm.mjs'); if (RELEASE_PROTOCOL !== 2) throw new Error('冻结源码不支持两阶段发布；请先恢复该批次，再提交新修改')"
            mise exec -- node scripts/publish-npm.mjs --prepare
            echo 'status=prepared' >> "$GITHUB_OUTPUT"
          fi

      - name: Record release result
        env:
          RELEASE_STATUS: ${{ steps.publish.outputs.status || 'none' }}
        run: |
          mise exec -- node --input-type=module <<'JS'
          import { mkdirSync, readFileSync, writeFileSync, appendFileSync } from 'node:fs'
          import { join } from 'node:path'
          import { git } from './scripts/release-git.mjs'
          let result = { status: 'none' }
          if (process.env.RELEASE_STATUS !== 'none') {
            const manifest = JSON.parse(readFileSync('.release/manifest.json', 'utf8'))
            result = {
              status: process.env.RELEASE_STATUS,
              version: manifest.version,
              sourceSha: git(process.cwd(), ['rev-parse', 'HEAD']),
              submoduleSha: manifest.submoduleSha,
              packages: manifest.packages.map(pkg => pkg.name),
            }
          }
          const directory = join(process.env.RUNNER_TEMP, 'release-result')
          mkdirSync(directory, { recursive: true })
          writeFileSync(join(directory, 'release-result.json'), JSON.stringify(result, null, 2) + '\n')
          const summary = result.status === 'published'
            ? `全部 ${result.packages.length} 个包已完成 ${result.version} 发布及双仓标签验证。\n`
            : result.status === 'prepared'
              ? `${result.version} 已准备并冻结为 ${result.sourceSha}，尚未上传 npm；从 bit-framework-release/pending 启动发布运行。\n`
              : '没有待发布的 Changeset 或未完成批次。\n'
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary)
          JS

      - uses: actions/upload-artifact@v4
        with:
          name: release-result
          path: ${{ runner.temp }}/release-result/release-result.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
