# 推送 v* tag 时把所有包发布到本项目的 Package Registry
# （bit-cc/bit-framework，project 901）。包含 vendor/fairygui-cc（submodule）。
# 包名与 npmjs 一致（@gongxh/*）：项目级 endpoint 不要求 scope 与 namespace 同名。
#
# npmjs 侧由 GitHub Actions 负责（npm trusted publishing 只信任 gitlab.com，
# 不支持自建 GitLab 实例），此处只发公司内网 registry。

stages:
  - publish

publish:gitlab:
  stage: publish
  image: node:22

  # 实例级共享 runner 配置了 run_untagged=false，只接带标签的 job，
  # 不写 tags 会一直 pending（提示 no runners online）。
  tags:
    - docker

  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

  variables:
    # fgui 是构建 bit-ui / bit-condition 的前置依赖
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_FORCE_HTTPS: 'true'

  before_script:
    - corepack enable
    - corepack prepare pnpm@10 --activate
    - pnpm --version

  script:
    - pnpm install --frozen-lockfile
    - pnpm build
    # 脚本内部读取 CI_JOB_TOKEN 完成认证
    - node scripts/publish-gitlab.mjs
