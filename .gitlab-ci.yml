# 推送 v* tag 时把所有包以 @bit-cc/* 发布到本项目的 Package Registry
# （bit-cc/bit-framework，project 901）。包含 vendor/fairygui-cc（submodule）。
#
# npmjs 侧由 GitHub Actions 负责（npm trusted publishing 只信任 gitlab.com，
# 不支持自建 GitLab 实例），此处只发公司内网 registry。

stages:
  - publish

publish:gitlab:
  stage: publish
  image: node:22

  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

  variables:
    # fgui 是构建 bit-ui / bit-condition 的前置依赖
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_FORCE_HTTPS: 'true'

  before_script:
    - corepack enable
    - corepack prepare pnpm@10 --activate
    - pnpm --version

  script:
    - pnpm install --frozen-lockfile
    - pnpm build
    # 脚本内部读取 CI_JOB_TOKEN 完成认证，并把 @gongxh/* remap 成 @bit-cc/*
    - node scripts/publish-gitlab.mjs
