[tools]
node = "22.14.0"
pnpm = "10.28.0"
gh = "2.85.0"

[tasks.setup]
description = "初始化或同步工具环境、Git 子模块和 workspace 依赖"
run = [
    "mise install",
    "git submodule sync --recursive",
    "git submodule update --init --recursive --checkout",
    'if [ "${CI:-}" = "true" ]; then pnpm install --frozen-lockfile; else pnpm install; fi',
]

[tasks.build]
description = "按依赖顺序编译全部模块，包含 FairyGUI"
run = "pnpm -r build"

[tasks.changeset]
description = "记录变更说明和版本升级级别，供发布时生成 CHANGELOG"
run = "pnpm exec changeset"

[tasks.publish]
description = "构建、准备 Changeset、提交推送全部修改并统一发布 npm"
raw = true
run = "node scripts/publish.mjs"
